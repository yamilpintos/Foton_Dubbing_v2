# Render — sitio estático. No hay build ni backend: se publica la carpeta tal cual.
# Si conectás el repo desde el panel de Render, este archivo ya deja todo configurado
# (Blueprint). Si lo hacés a mano: Static Site · Build Command vacío · Publish Directory "."
services:
  - type: web
    name: dubai-demo
    runtime: static
    # El "build" es sólo hornear las credenciales de Google en static/config.js,
    # porque un sitio estático no puede leer variables de entorno al visitarse.
    buildCommand: "sh ./build.sh"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    envVars:
      # sync: false = Render las pide al desplegar y NO quedan escritas en el repo.
      # Se cargan y se editan en: panel -> dubai-demo -> Environment.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_PROJECT_NUMBER
        sync: false
    headers:
      # el video no cambia nunca: que el navegador y la CDN lo guarden
      - path: /media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/*
        name: Cache-Control
        value: public, max-age=3600
# Sin reglas de rewrite a propósito: es una sola página, no hay ruteo de cliente.
# Un rewrite /* -> /index.html podría interponerse con /media/resultado.mp4.
